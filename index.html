<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to inody.net</title>
<link rel="canonical" href="https://inody.net/">
<meta name="robots" content="noindex">
<script>
  // Preserve the path/query/hash so old deep links land on the same page on the new domain.
  var dest = "https://inody.net" + window.location.pathname + window.location.search + window.location.hash;
  window.location.replace(dest);
</script>
<meta http-equiv="refresh" content="0; url=https://inody.net/">
</head>
<body>
<p>This site has moved to <a href="https://inody.net/">inody.net</a>. Redirecting&hellip;</p>
</body>
</html>
